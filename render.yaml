services:
  - type: web
    name: toolspage-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: RUN_QUEUE_WORKER_IN_API
        value: "false"
      - key: ALLOW_IN_MEMORY_QUEUE_FALLBACK
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: toolspage-redis
          property: connectionString

  - type: worker
    name: toolspage-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_QUEUE_WORKER_IN_API
        value: "false"
      - key: ALLOW_IN_MEMORY_QUEUE_FALLBACK
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: toolspage-redis
          property: connectionString

  - type: redis
    name: toolspage-redis
    plan: free
    maxmemoryPolicy: noeviction
