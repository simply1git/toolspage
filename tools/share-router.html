<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routing File - Toolspage</title>
  <style>
    body { background: #030712; color: #fff; font-family: sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .loader { text-align: center; }
    .spinner { margin-top: 1rem; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #0f766e; border-radius: 50%; animation: spin 1s infinite linear; display: inline-block; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <h2>Receiving your file from OS...</h2>
    <div class="spinner"></div>
  </div>
  <script>
    async function routeSharedFile() {
      try {
        const shareCache = await caches.open("toolspage-share");
        const res = await shareCache.match("/shared-file");
        if (!res) {
          window.location.href = "../index.html";
          return;
        }

        const mime = res.headers.get("Content-Type") || "";
        
        let target = "../index.html";
        if (mime.startsWith("video/")) {
          target = "video-compress.html?shared=1";
        } else if (mime.startsWith("image/")) {
          target = "jpg-to-pdf.html?shared=1";
        } else if (mime === "application/pdf") {
          target = "compress-pdf.html?shared=1";
        }

        setTimeout(() => {
          window.location.href = target;
        }, 800);
      } catch (err) {
        console.error(err);
        window.location.href = "../index.html";
      }
    }
    routeSharedFile();
  </script>
</body>
</html>
