<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to JPG - Toolspage</title>
  <meta name="description" content="Convert PDF pages to JPG/PNG images." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">TOOLSPAGE</a>
      <div class="nav-right">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="menuBtn" class="menu-btn" aria-label="Open navigation">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav id="mainNav" class="main-nav" aria-label="Primary">
        <a href="../index.html#tools">Tools</a>
        <a href="../index.html#trust">Trust</a>
      </nav>
    </div>
  </header>
  <main class="tool-shell container">
    <a class="back-link" href="../index.html">Back to Home</a>
    <div class="tool-layout">
      <section class="tool-panel">
        <h1>PDF to JPG</h1>
        <p>Convert PDF pages to JPG. Small single-page requests run in-browser; multi-page or larger files are processed via backend queue.</p>
        <form id="pdfToJpgForm" class="tool-form">
          <div><label for="pdfToJpgFile">PDF file</label><input id="pdfToJpgFile" type="file" accept=".pdf,application/pdf" required /></div>
          <div><label for="pdfRenderScale">Quality scale</label><select id="pdfRenderScale"><option value="1.2">Standard</option><option value="1.8" selected>High</option><option value="2.4">Very high</option></select></div>
          <div><label for="pdfPageMode">Page scope</label><select id="pdfPageMode"><option value="all" selected>All pages</option><option value="range">Custom range</option></select></div>
          <div class="inline-grid" id="pdfPageRange" hidden>
            <div><label for="pdfStartPage">Start page</label><input id="pdfStartPage" type="number" min="1" value="1" /></div>
            <div><label for="pdfEndPage">End page</label><input id="pdfEndPage" type="number" min="1" value="1" /></div>
          </div>
          <button class="btn btn-primary" type="submit">Convert</button>
          <p class="muted" id="pdfToJpgStatus" aria-live="polite"></p>
          <div class="result-box" hidden data-result><p class="result-line" data-result-text></p><a href="#" class="tool-link" data-download-link>Download</a></div>
        </form>
      </section>
      <aside class="tool-panel"><h2>Note</h2><p class="muted">Multi-page output is delivered as a ZIP archive of JPG files. Single-page output downloads as JPG.</p></aside>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    }
  </script>
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/pdf-to-jpg.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
