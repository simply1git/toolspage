<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Convert - Toolspage</title>
  <meta name="description" content="Convert audio between MP3, WAV, AAC, OGG, and M4A." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">TOOLSPAGE</a>
      <div class="nav-right">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="menuBtn" class="menu-btn" aria-label="Open navigation">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav id="mainNav" class="main-nav" aria-label="Primary">
        <a href="../index.html#tools">Tools</a>
        <a href="../index.html#trust">Trust</a>
      </nav>
    </div>
  </header>

  <main class="tool-shell container">
    <a class="back-link" href="../index.html">Back to Home</a>
    <div class="tool-layout">
      <section class="tool-panel">
        <h1>Audio Convert</h1>
        <p>Transcode audio files into the format you need.</p>
        <form id="audioConvertForm" class="tool-form">
          <div>
            <label for="audioConvertFile">Audio file</label>
            <input id="audioConvertFile" name="file" type="file" accept="audio/*,.mp3,.wav,.aac,.ogg,.m4a,.flac" required />
          </div>
          <div class="inline-grid">
            <div>
              <label for="targetFormat">Output format</label>
              <select id="targetFormat" name="targetFormat">
                <option value="mp3" selected>MP3</option>
                <option value="wav">WAV</option>
                <option value="aac">AAC</option>
                <option value="ogg">OGG</option>
                <option value="m4a">M4A</option>
              </select>
            </div>
            <div>
              <label for="audioBitrate">Audio quality (bitrate)</label>
              <select id="audioBitrate" name="bitrateKbps">
                <option value="128">128 kbps</option>
                <option value="192" selected>192 kbps</option>
                <option value="256">256 kbps</option>
              </select>
            </div>
          </div>

          <div class="inline-grid">
            <div class="form-group">
              <label for="metaTitle">Custom title (optional)</label>
              <input type="text" id="metaTitle" placeholder="e.g. My Awesome Track" />
            </div>
            <div class="form-group">
              <label for="metaArtist">Custom artist (optional)</label>
              <input type="text" id="metaArtist" placeholder="e.g. DJ Toolspage" />
            </div>
          </div>

          <button class="btn btn-primary" type="submit">Convert Audio</button>
          <p id="audioConvertStatus" class="muted" aria-live="polite"></p>
          <div class="result-box" hidden data-result>
            <p class="result-line" data-result-text></p>
            <a href="#" class="tool-link" data-download-link>Download Converted Audio</a>
          </div>
        </form>
      </section>

      <aside class="tool-panel">
        <h2>Format guidance</h2>
        <ul>
          <li>MP3 and AAC are compact for sharing.</li>
          <li>WAV preserves uncompressed PCM quality.</li>
          <li>OGG and M4A are useful for app distribution workflows.</li>
        </ul>
      </aside>
    </div>
  </main>

  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/audio-convert.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
